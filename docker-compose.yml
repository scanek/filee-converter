services:
  filee-converter:
    build: .
    image: scanek/filee-converter:latest
    container_name: filee-converter
    restart: unless-stopped
    ports:
      - "${PORT:-8089}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - FILEE_DATA_DIR=/tmp/filee-data
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
